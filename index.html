ds{display:grid;grid-template-columns:1fr;gap:11px}.project{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:0 4px 15px #1e293b06}.projecttop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.projectname{font-size:16px;font-weight:800;line-height:1.25}.developer{font-size:12px;color:var(--muted);margin-top:4px}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;white-space:nowrap}.tag.ready{background:var(--greenbg);color:var(--green)}.tag.future{background:var(--amberbg);color:var(--amber)}.tag.check{background:#edf1f6;color:#5c6c7d}.tag.other{background:#e8efff;color:#1d4ed8}.projectmeta{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.pill{background:#f1f4f8;border-radius:8px;padding:6px 8px;font-size:11px;color:#56677a}.projectactions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:750;font-size:12px}.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.soft{background:#edf2f7;color:#33465a}.btn.danger{background:#fff0f0;color:#b42318}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cad4df;border-radius:16px}.addbar{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}.addbar button{display:block;max-width:888px;width:100%;margin:auto;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800}.modalback{position:fixed;inset:0;background:#0c1726a8;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}.modalback.show{display:flex}.modal{width:100%;max-width:700px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 45px #0002}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.modalhead h2{font-size:19px;margin:0}.close{width:36px;height:36px;border:0;border-radius:50%;background:#eef2f6;font-size:22px;color:#334}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;color:#4a5b6d;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e1e9;border-radius:11px;padding:12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7da4ff;box-shadow:0 0 0 3px #2563eb15}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.calcbox{margin-top:12px;background:#edf4ff;border:1px solid #d4e4ff;border-radius:15px;padding:14px}.calcbox .label{font-size:12px;color:#42618c}.bigmoney{font-size:24px;font-weight:850;color:#1747a6;margin:4px 0}.calcrow{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#4c6078;margin-top:8px}.quickperc{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quickperc button{border:1px solid #c9d9f5;background:#fff;border-radius:999px;padding:7px 11px;color:#2352a3;font-size:12px;font-weight:750}.detailsgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detailbox{padding:12px;background:#f5f7fa;border-radius:12px}.detailbox small{display:block;color:var(--muted);font-size:11px}.detailbox strong{display:block;margin-top:4px;font-size:14px;overflow-wrap:anywhere}.bottomnav{display:flex;justify-content:center;gap:12px;color:var(--muted);font-size:11px;margin-top:20px}.footer{text-align:center;color:#8491a0;font-size:10px;padding:20px 0 5px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#172536;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;display:none;z-index:20;box-shadow:0 5px 20px #0002;max-width:90%;text-align:center}.toast.show{display:block}.note{font-size:11px;color:var(--muted); /* Premium mobile refinement */
:root{
 --navy:#14243a;--navy2:#243d59;--blue:#315fe8;--ink:#182538;
 --muted:#738196;--bg:#f5f7fb;--card:#ffffff;--line:#e4eaf2;
 --green:#28794f;--greenbg:#e9f6ee;--amber:#966315;--amberbg:#fff4dc;
 --radius:20px;
}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{font-size:15px;line-height:1.45}
.app{max-width:760px;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.top{
 padding:calc(18px + env(safe-area-inset-top)) 22px 22px;
 border-radius:0 0 24px 24px;
 background:linear-gradient(145deg,#14243a 0%,#213c59 100%);
}
.brandrow{gap:11px}
.logo{width:42px;height:42px;border-radius:13px;flex:0 0 auto}
.brand{font-size:19px;letter-spacing:-.25px}
.sub{font-size:12px}
.topnote{font-size:13px;line-height:1.55;margin-top:14px;max-width:330px;color:#d7e1ed}
.main{padding:18px 18px 24px}
.searchwrap{margin:0 0 14px}
.search{min-height:52px;padding:14px 14px 14px 42px;border-radius:16px;font-size:15px;box-shadow:0 2px 8px #18253805}
.searchicon{top:13px}
.tabs{gap:10px;margin:14px 0 15px}
.tab{min-height:72px;padding:12px 8px;border-radius:17px;font-size:14px}
.tab small{font-size:11px;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:7px;overflow:visible;padding:0 0 14px}
.chip{padding:8px 11px;font-size:12px;min-height:34px}
.sectionhead{margin:5px 0 12px}
.sectionhead h2{font-size:19px;letter-spacing:-.3px}
.count{font-size:12px;white-space:nowrap}
.cards{gap:10px}
.project{padding:15px;border-radius:19px;box-shadow:0 3px 12px #1c2c4007;border-color:#e5eaf1}
.projecttop{gap:8px}
.projectname{font-size:16px;letter-spacing:-.2px}
.developer{font-size:12px;line-height:1.4}
.tag{white-space:normal;text-align:center;justify-content:center;max-width:48%;font-size:10px;padding:6px 8px;line-height:1.3}
.projectmeta{gap:6px;margin:11px 0}
.pill{font-size:11px;padding:6px 8px;border-radius:9px}
.projectactions{gap:8px;margin-top:11px}
.btn{font-size:12px;padding:10px 12px;min-height:40px;border-radius:12px}
.btn.primary{flex:1}
.btn.soft{flex:0 0 auto}
.addbar{
 padding:10px 16px calc(10px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
}
.addbar button{
 max-width:720px;border-radius:15px;padding:14px 16px;min-height:52px;
 font-size:15px;box-shadow:0 5px 14px #315fe81c;
}
.modalback{padding:0}
.modal{padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0}
.field label{font-size:12px}
.field input,.field select,.field textarea{min-height:45px;border-radius:12px;font-size:15px}
.detailsgrid{gap:8px}
.detailbox{border:1px solid #e8edf4;border-radius:13px;padding:11px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}
@media(max-width:380px){
 .main{padding-left:13px;padding-right:13px}
 .top{padding-left:18px;padding-right:18px}
 .project{padding:13px}
 .projectname{font-size:15px}
 .tag{font-size:9px}
 .tabs{gap:7px}
}
@media(min-width:650px){
 .top{padding:26px 28px}
 .main{padding:22px 28px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .modalback{align-items:center;padding:20px}
 .modal{border-radius:22px;padding:24px;max-height:88vh}
 .addbar{padding-left:28px;padding-right:28px}
 .projectname{font-size:17px}
 .filters{flex-wrap:wrap}
}

</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brandrow"><div class="logo">NK</div><div><div class="brand">NK Property Desk</div><div class="sub">YOUR SIMPLE REAL ESTATE FINDER</div></div></div>
  <div class="topnote">Find a project quickly. Check delivery. Calculate the down payment.</div>
</header>
<main class="main">
  <div class="searchwrap"><span class="searchicon">⌕</span><input id="search" class="search" placeholder="Search project, developer or area..." autocomplete="off"></div>
  <div class="tabs">
    <button class="tab active" data-kind="apartments">▦ Apartments <small>Service & Regular</small></button>
    <button class="tab" data-kind="villas">⌂ Villas <small>All villa projects</small></button>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All projects</button>
    <button class="chip" data-filter="ready">Ready to move</button>
    <button class="chip" data-filter="18m">18 months</button>
    <button class="chip" data-filter="verify">Needs verification</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">
    <button class="chip" id="exportBtn">Export backup</button>
    <button class="chip" id="importBtn">Import backup</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="sectionhead"><h2 id="listTitle">Apartments</h2><span class="count" id="count"></span></div>
  <div id="cards" class="cards"></div>
  <div class="bottomnav"><span>Simple</span> · <span>Organized</span> · <span>Easy to update</span></div>
  <div class="footer">NK Property Desk · Prototype data based on your current notes</div>
</main>
</div>
<div class="addbar"><button id="addBtn">＋ Add Project / Unit</button></div>
<div class="modalback" id="modalBack" role="dialog" aria-modal="true">
  <section class="modal">
    <div class="modalhead"><h2 id="modalTitle">Project details</h2><button class="close" id="closeModal" aria-label="Close">×</button></div>
    <div id="modalBody"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const initialProjects = [
 {id:"a1",name:"ORA – Solana East",developer:"ORA Developers",kind:"apartments",category:"Service Apartments",delivery:"verify",deliveryText:"Needs verification",area:"New Cairo / East",note:"Service apartments. Confirm current inventory and exact delivery."},
 {id:"a2",name:"PRE",developer:"PRE",kind:"apartments",category:"Service Apartments",delivery:"verify",deliveryText:"Needs verification",note:"Project name kept as provided; confirm full project name."},
 {id:"a3",name:"Al Marasem – Fifty Square",developer:"Al Marasem",kind:"apartments",category:"Service Apartments",delivery:"verify",deliveryText:"Needs verification",note:"Service apartment entry as provided. Confirm unit-specific details."},
 {id:"a4",name:"LMD",developer:"LMD",kind:"apartments",category:"Service Apartments",delivery:"verify",deliveryText:"Needs verification",note:"Confirm the specific project and current inventory."},
 {id:"a5",name:"SODIC East – New Heliopolis",developer:"SODIC",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"User grouped remaining apartment projects as 3–4 years; verify per unit."},
 {id:"a6",name:"Mountain View 1.1",developer:"Mountain View",kind:"apartments",category:"Regular Apartments",delivery:"ready",deliveryText:"Ready to move (reported)",note:"User reported immediate-delivery units; confirm current unit availability."},
 {id:"a7",name:"Hyde Park",developer:"Hyde Park Developments",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Delivery estimate needs project/unit verification."},
 {id:"a8",name:"Palm Hills",developer:"Palm Hills Developments",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Delivery estimate needs project/unit verification."},
 {id:"a9",name:"Taj City",developer:"Madinet Masr",kind:"apartments",category:"Regular Apartments",delivery:"ready",deliveryText:"Ready to move (reported)",note:"User reported immediate-delivery units; confirm current unit availability."},
 {id:"a10",name:"Al Marasem",developer:"Al Marasem",kind:"apartments",category:"Regular Apartments",delivery:"ready",deliveryText:"Ready to move (reported)",note:"Fifth Square was reported to have immediate-delivery apartments; confirm specific unit."},
 {id:"a11",name:"Al Abraj",developer:"Al Abraj",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Project name kept as provided; confirm exact development."},
 {id:"a12",name:"Kayan",developer:"Kayan",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Confirm developer, exact project and delivery."},
 {id:"a13",name:"Zomra",developer:"Needs confirmation",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Name kept as provided; confirm spelling and exact project."},
 {id:"a14",name:"Nations of Sky",developer:"Needs confirmation",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Name kept as provided; confirm exact project spelling."},
 {id:"a15",name:"Aliva – Mostakbal City",developer:"Mountain View",kind:"apartments",category:"Regular Apartments",delivery:"future",deliveryText:"3–4 years (verify)",note:"Delivery estimate needs project/unit verification."},
 {id:"a16",name:"Sarai",developer:"MISR Italia Properties",kind:"apartments",category:"Regular Apartments",delivery:"ready",deliveryText:"Ready to move (reported)",note:"User reported immediate-delivery apartments; confirm the exact available unit and phase."},
 {id:"v1",name:"La Vista City",developer:"La Vista Developments",kind:"villas",category:"Villas",delivery:"ready",deliveryText:"Ready to move (reported)",area:"New Administrative Capital",note:"User location note: next to Al-Fattah Al-Aleem Mosque, on Bin Zayed Axis. Confirm current available units."},
 {id:"v2",name:"El Patio Town",developer:"La Vista Developments",kind:"villas",category:"Villas",delivery:"18m",deliveryText:"18 months (reported)",area:"End of AUC Street (verify)",note:"User reported delivery in 18 months. Confirm exact unit and date."},
 {id:"v3",name:"El Patio TownSide",developer:"La Vista Developments",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",area:"End of AUC Street (verify)",note:"Listed with El Patio projects; delivery not specified separately."},
 {id:"v4",name:"Grove",developer:"Hassan Allam Properties",kind:"villas",category:"Villas",delivery:"18m",deliveryText:"18 months (reported)",area:"End of AUC Street (verify)",note:"User said this project is by Hassan Allam and reported delivery in 18 months. Confirm exact official name."},
 {id:"v5",name:"Eastshire",developer:"Al Qamzi Developments",kind:"villas",category:"Villas",delivery:"18m",deliveryText:"18 months (reported)",area:"New Cairo / AUC area (verify)",note:"User reported delivery in 18 months. Verify exact location and available units."},
 {id:"v6",name:"Mountain View 1.1",developer:"Mountain View",kind:"villas",category:"Villas",delivery:"ready",deliveryText:"Ready to move (reported)",note:"User reported immediate-delivery villas; confirm current unit availability."},
 {id:"v7",name:"Hyde Park",developer:"Hyde Park Developments",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Villa inventory and delivery require confirmation."},
 {id:"v8",name:"LMD",developer:"LMD",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Specific villa project and delivery require confirmation."},
 {id:"v9",name:"Solana East",developer:"ORA Developers",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Project included in villa list as requested; confirm unit types and availability."},
 {id:"v10",name:"SODIC East – Villas",developer:"SODIC",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",area:"New Heliopolis",note:"Kept separate from apartment entry. Confirm exact phase and available villa inventory."},
 {id:"v11",name:"Eastville (AJNA – name to verify)",developer:"AJNA Developments",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Temporary spelling based on user's 'East Villa'; confirm official project name."},
 {id:"v12",name:"Sarai",developer:"MISR Italia Properties",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Included in villa list; delivery and available units not specified."},
 {id:"v13",name:"Taj City",developer:"Madinet Masr",kind:"villas",category:"Villas",delivery:"verify",deliveryText:"Needs verification",note:"Villa inventory and delivery require confirmation."}
];
const STORAGE_KEY = "nkPropertyDesk.v2";
let projects = loadData();
let kind = "apartments", filter = "all", activeProject = null;
function loadData(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const parsed=JSON.parse(saved);if(Array.isArray(parsed)&&parsed.length)return parsed}}catch(e){}return initialProjects.map(p=>({...p}))}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));return true}catch(e){toast("Could not save in this browser. Export your data as backup.");return false}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})+" EGP"}
function statusClass(p){return p.delivery==="ready"?"ready":p.delivery==="18m"?"future":p.delivery==="future"?"future":"check"}
function statusText(p){return p.deliveryText || (p.delivery==="ready"?"Ready to move":p.delivery==="18m"?"18 months":p.delivery==="future"?"Future delivery":"Needs verification")}
function render(){
 const query=document.getElementById("search").value.trim().toLowerCase();
 const filtered=projects.filter(p=>p.kind===kind&&[p.name,p.developer,p.area,p.category,p.note].join(" ").toLowerCase().includes(query)&&(filter==="all"||(filter==="ready"&&p.delivery==="ready")||(filter==="18m"&&p.delivery==="18m")||(filter==="verify"&&p.delivery==="verify")));
 document.getElementById("listTitle").textContent=kind==="apartments"?"Apartments":"Villas";
 document.getElementById("count").textContent=filtered.length+" projects";
 document.getElementById("cards").innerHTML=filtered.length?filtered.map(p=>`
 <article class="project">
  <div class="projecttop"><div><div class="projectname">${esc(p.name)}</div><div class="developer">${esc(p.developer||"Developer not added")}</div></div><span class="tag ${statusClass(p)}">${esc(statusText(p))}</span></div>
  <div class="projectmeta"><span class="pill">${esc(p.category||"Villas")}</span>${p.area?`<span class="pill">⌖ ${esc(p.area)}</span>`:""}${p.price?`<span class="pill">${money(p.price)}</span>`:""}</div>
  ${p.price?`<div class="projectmeta"><span class="pill">Down payment: ${p.dpPercent!==""&&p.dpPercent!=null?esc(p.dpPercent)+"%":p.dpAmount?money(p.dpAmount):"Not set"}</span>${p.dpPercent!==""&&p.dpPercent!=null?`<span class="pill">${money(Number(p.price)*Number(p.dpPercent)/100)}</span>`:""}</div>`:""}
  <div class="projectactions"><button class="btn primary" onclick="openDetails('${p.id}')">View details</button><button class="btn soft" onclick="openEdit('${p.id}')">Edit</button></div>
 </article>`).join(""):`<div class="empty">No projects found.<br><span class="note">Try another search or add a project.</span></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.kind===kind));
 document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function showModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalBack").classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){document.getElementById("modalBack").classList.remove("show");document.body.style.overflow="";activeProject=null}
function openDetails(id){
 const p=projects.find(x=>x.id===id);if(!p)return;activeProject=id;
 const price=p.price!==""&&p.price!=null?Number(p.price):0, dpPercent=p.dpPercent!==""&&p.dpPercent!=null?Number(p.dpPercent):null, dpAmount=dpPercent!==null?price*dpPercent/100:(p.dpAmount?Number(p.dpAmount):null);
 showModal(p.name,`
 <div class="detailsgrid">
 <div class="detailbox"><small>Category</small><strong>${esc(p.category||"Villas")}</strong></div>
 <div class="detailbox"><small>Developer</small><strong>${esc(p.developer||"Not added")}</strong></div>
 <div class="detailbox"><small>Delivery status</small><strong>${esc(statusText(p))}</strong></div>
 <div class="detailbox"><small>Area / Location</small><strong>${esc(p.area||"Not added")}</strong></div>
 </div>
 ${price?`<div class="calcbox"><div class="label">Unit Price</div><div class="bigmoney">${money(price)}</div><div class="calcrow"><span>Down payment</span><strong>${dpAmount!==null?money(dpAmount):"Not set"}</strong></div>${dpPercent!==null?`<div class="calcrow"><span>Down payment rate</span><strong>${dpPercent}%</strong></div>`:""}</div>`:""}
 ${p.note?`<div class="field"><label>Notes</label><div class="note">${esc(p.note)}</div></div>`:""}
 <div class="projectactions"><button class="btn primary" onclick="openDP('${p.id}')">Smart down payment</button><button class="btn soft" onclick="openEdit('${p.id}')">Edit</button></div>
 <p class="note">This prototype stores changes in this browser on this device. It is not cloud-synced yet. Delivery labels marked “reported” need unit-level availability confirmation.</p>
 `);
}
function openDP(id){
 const p=projects.find(x=>x.id===id);if(!p)return;activeProject=id;
 const price=p.price!==""&&p.price!=null?Number(p.price):0;
 showModal("Smart Down Payment",`
 <div class="field"><label>Project / Unit</label><input value="${esc(p.name)}" disabled></div>
 <div class="field"><label>Unit price (EGP)</label><input id="dpPrice" type="number" min="0" inputmode="decimal" value="${price||""}" placeholder="Enter unit price"></div>
 <div class="field"><label>Choose a percentage or enter your own</label><input id="dpRate" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="${p.dpPercent!==""&&p.dpPercent!=null?esc(p.dpPercent):"10"}" placeholder="Down payment %"><div class="quickperc">${[5,10,15,20,25,30].map(n=>`<button type="button" onclick="setPercent(${n})">${n}%</button>`).join("")}</div></div>
 <div class="calcbox"><div class="label">Calculated Down Payment</div><div id="dpResult" class="bigmoney">—</div><div class="calcrow"><span>Down payment rate</span><strong id="dpRateLabel">10%</strong></div><div class="calcrow"><span>Remaining amount</span><strong id="dpRemaining">—</strong></div></div>
 <div class="projectactions"><button class="btn primary" onclick="saveDP('${p.id}')">Save to this project</button><button class="btn soft" onclick="closeModal()">Cancel</button></div>
 <p class="note">The calculator works with any price and percentage. Saving stores the price and default down-payment rate on this project entry.</p>
 `);
 const priceEl=document.getElementById("dpPrice"), rateEl=document.getElementById("dpRate");
 const update=()=>{const pr=Number(priceEl.value),rt=Number(rateEl.value),valid=priceEl.value!==""&&rateEl.value!==""&&pr>=0&&rt>=0&&rt<=100;document.getElementById("dpResult").textContent=valid?money(pr*rt/100):"Check values";document.getElementById("dpRateLabel").textContent=rateEl.value!==""&&rt>=0&&rt<=100?rt+"%":"—";document.getElementById("dpRemaining").textContent=valid?money(pr-(pr*rt/100)):"—"};
 priceEl.addEventListener("input",update);rateEl.addEventListener("input",update);update();
}
function setPercent(n){const el=document.getElementById("dpRate");if(el){el.value=n;el.dispatchEvent(new Event("input"))}}
function saveDP(id){const p=projects.find(x=>x.id===id);if(!p)return;const priceEl=document.getElementById("dpPrice"),rateEl=document.getElementById("dpRate");const pr=Number(priceEl.value),rt=Number(rateEl.value);if(priceEl.value===""||rateEl.value===""||!Number.isFinite(pr)||pr<0||!Number.isFinite(rt)||rt<0||rt>100){toast("Enter a valid price and a percentage from 0 to 100.");return}p.price=pr;p.dpPercent=rt;p.dpAmount=pr*rt/100;saveData();closeModal();render();toast("Down payment saved.");}
function openEdit(id){
 const p=id?projects.find(x=>x.id===id):null;activeProject=id||null;
 const value=(k,d="")=>esc(p&&p[k]!=null?p[k]:d);
 showModal(p?"Edit project":"Add project / unit",`
 <form id="projectForm" onsubmit="saveProject(event,'${id||""}')">
 <div class="field"><label>Project name *</label><input name="name" required value="${value("name")}" placeholder="e.g. Mountain View 1.1"></div>
 <div class="formgrid">
 <div class="field"><label>Section *</label><select name="kind"><option value="apartments" ${value("kind",kind)==="apartments"?"selected":""}>Apartments</option><option value="villas" ${value("kind",kind)==="villas"?"selected":""}>Villas</option></select></div>
 <div class="field"><label>Apartment category</label><select name="category"><option ${value("category")==="Service Apartments"?"selected":""}>Service Apartments</option><option ${value("category")==="Regular Apartments"?"selected":""}>Regular Apartments</option><option ${value("category")==="Villas"?"selected":""}>Villas</option></select></div>
 </div>
 <div class="field"><label>Developer</label><input name="developer" value="${value("developer")}" placeholder="Developer name"></div>
 <div class="field"><label>Area / Location</label><input name="area" value="${value("area")}" placeholder="Area or nearby landmark"></div>
 <div class="field"><label>Delivery status</label><select name="delivery"><option value="verify" ${value("delivery","verify")==="verify"?"selected":""}>Needs verification</option><option value="ready" ${value("delivery")==="ready"?"selected":""}>Ready to move (reported)</option><option value="18m" ${value("delivery")==="18m"?"selected":""}>Delivery in 18 months (reported)</option><option value="future" ${value("delivery")==="future"?"selected":""}>Future delivery (verify)</option></select></div>
 <div class="formgrid">
 <div class="field"><label>Unit price (EGP)</label><input name="price" type="number" min="0" step="any" inputmode="decimal" value="${value("price")}" placeholder="Optional"></div>
 <div class="field"><label>Down payment (%)</label><input name="dpPercent" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="${value("dpPercent")}" placeholder="Optional"></div>
 </div>
 <div class="field"><label>Notes</label><textarea name="note" rows="3" placeholder="Optional notes">${value("note")}</textarea></div>
 <p class="note">Only add a price or down payment if you have the unit's actual details. Leave unknown information blank.</p>
 <div class="projectactions"><button type="submit" class="btn primary">Save</button><button type="button" class="btn soft" onclick="closeModal()">Cancel</button>${p?`<button type="button" class="btn danger" onclick="deleteProject('${p.id}')">Delete</button>`:""}</div>
 </form>`);
}
function saveProject(event,id){event.preventDefault();const form=event.target,fd=new FormData(form),name=String(fd.get("name")||"").trim();if(!name){toast("Project name is required.");return}
 const k=fd.get("kind"),cat=k==="villas"?"Villas":fd.get("category"),del=fd.get("delivery");
 const deliveryText=del==="ready"?"Ready to move (reported)":del==="18m"?"18 months (reported)":del==="future"?"Future delivery (verify)":"Needs verification";
 const rawPrice=fd.get("price"),rawRate=fd.get("dpPercent");
 const obj={name,kind:k,category:cat,developer:String(fd.get("developer")||"").trim(),area:String(fd.get("area")||"").trim(),delivery:del,deliveryText,note:String(fd.get("note")||"").trim(),price:rawPrice===""?"":Number(rawPrice),dpPercent:rawRate===""?"":Number(rawRate)};
 if(obj.dpPercent!==""&&(obj.dpPercent<0||obj.dpPercent>100)){toast("Down payment must be between 0 and 100%.");return}
 if(obj.price!==""&&obj.dpPercent!=="")obj.dpAmount=obj.price*obj.dpPercent/100;
 if(id){const i=projects.findIndex(x=>x.id===id);if(i>=0)projects[i]={...projects[i],...obj}}else{obj.id="custom-"+Date.now();projects.push(obj)}
 saveData();kind=k;filter="all";closeModal();render();toast("Saved successfully.");}
function deleteProject(id){if(!confirm("Delete this project from this device?"))return;projects=projects.filter(p=>p.id!==id);saveData();closeModal();render();toast("Project deleted.");}
function exportBackup(){
 const payload={app:"NK Property Desk",version:2,exportedAt:new Date().toISOString(),projects};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="NK-Property-Desk-backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 toast("Backup file prepared.");
}
function importBackup(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(String(reader.result||""));
   const rows=Array.isArray(data)?data:data.projects;
   if(!Array.isArray(rows)||!rows.every(p=>p&&typeof p==="object"&&typeof p.name==="string"&&["apartments","villas"].includes(p.kind))){
    toast("Invalid backup file. No changes made.");return;
   }
   if(!confirm("Import will replace the current list on this device. Export a backup first if needed. Continue?"))return;
   projects=rows.map((p,i)=>({...p,id:String(p.id||("import-"+Date.now()+"-"+i))}));
   if(saveData()){render();toast("Backup imported successfully.");}
  }catch(e){toast("Could not read this backup file.");}
  finally{event.target.value="";}
 };
 reader.onerror=()=>{toast("Could not read this file.");event.target.value="";};
 reader.readAsText(file);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;filter="all";render()}));
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;render()}));
document.getElementById("search").addEventListener("input",render);
document.getElementById("addBtn").addEventListener("click",()=>openEdit(null));
document.getElementById("exportBtn").addEventListener("click",exportBackup);
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",importBackup);
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
</body>
</html>
